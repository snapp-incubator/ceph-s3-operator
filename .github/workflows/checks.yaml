name: Checks (lint+test)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout 5m

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # without this the job runs on the runner's default go, which panics
      # controller-gen v0.11.1
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: false
      - name: run tests using make
        run: make test

  e2e-test:
    name: e2e-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: checkout code
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: false
      - name: Install kuttl
        run: |
          curl -L https://github.com/kudobuilder/kuttl/releases/download/v0.15.0/kubectl-kuttl_0.15.0_linux_x86_64 -o /usr/local/bin/kubectl-kuttl
          chmod +x /usr/local/bin/kubectl-kuttl
      - name: Run e2e test
        run: make e2e-test IMG=ceph-s3-operator:latest
